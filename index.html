<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mood Rooms is a personal space for arranging music by mood."
    />
    <title>Mood Rooms</title>
    <link rel="icon" href="assets/sample-cover.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/script.ts"></script>
  </head>
  <body>
    <main class="room-shell" id="room-list-view">

      <header class="room-header">
        <h1>Mood Rooms</h1>
        <p class="eyebrow">Spa for your Ears</p>
        <p class="room-description">
          A calm place to enjoy the songs that make your life feel yours.
        </p>
      </header>

      <section class="room-canvas" aria-labelledby="collection-heading">
        <div class="split-container">
          <div class="box-text">Your Mood Rooms:</div>
          <button class="add-button" id="add-room-button" type="button">Add Room</button>
        </div>
        <div class="card-collection" id="card-collection" aria-live="polite"></div>
      </section>

    </main>

    <main class="room-detail-view" id="room-detail-view" hidden>
      <button class="back-button" id="back-button" type="button">← Back</button>

      <article class="cover-card selected-card">
        <img class="cover-art" id="selected-card-art" src="" alt="" />
        <div class="cover-details">
          <h2 class="selected-card-title" id="selected-card-title"></h2>
          <p id="selected-card-artist"></p>
        </div>
      </article>
    </main>

    <dialog class="room-dialog" id="room-dialog" aria-labelledby="room-dialog-title">
      <form class="room-form" id="room-form">
        <h2 id="room-dialog-title">Add a room</h2>

        <label for="room-title">Title</label>
        <input id="room-title" name="title" type="text" maxlength="60" required />

        <label for="room-artist">Artist</label>
        <input id="room-artist" name="artist" type="text" maxlength="60" required />

        <label for="room-cover">Cover SVG</label>
        <input
          id="room-cover"
          name="cover"
          type="file"
          accept=".svg,image/svg+xml"
          required
        />

        <div class="room-form-actions">
          <button id="cancel-room-button" type="button">Cancel</button>
          <button type="submit">Add room</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
